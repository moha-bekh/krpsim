name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
    # Only paths that can actually move a benchmark number. `push` has no
    # partial-run logic (the `changes` job forces RUN_ALL on every push to
    # main, to keep the baseline complete), so without this filter a
    # docs-only push would still trigger the full 10-job run.
    paths: &benchmark-paths
      - "src/**"
      - "include/krpsim/**"
      - "resources/**"
      - "benchmarks/**"
      - "CMakeLists.txt"
      - ".github/workflows/codspeed.yml"
      # Markdown anywhere in those trees (READMEs, CODSPEED_REPORT.md) can't
      # move a benchmark number, so it doesn't count even when it lives
      # under an included directory above.
      - "!**/*.md"
  pull_request:
    # `pull_request` already gets partial/skipped shards via the `changes`
    # job, but this still saves spinning that job up at all on a docs-only
    # PR.
    paths: *benchmark-paths
  # `workflow_dispatch` is intentionally left unfiltered (paths filters
  # don't apply to it anyway): it's an explicit, manual request to run,
  # and CodSpeed also uses it to trigger backtest performance analysis in
  # order to generate initial data.
  workflow_dispatch:

jobs:
  # Detects which parts of the benchmark suite are affected by this change
  # and builds the list of shards to run. Pull requests only get the
  # shard(s) touched by the change (partial run); pushes to main and manual
  # dispatches always run every shard, to keep a complete baseline.
  changes:
    name: Detect affected benchmark shards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            parser:
              - 'src/parser/**'
              - 'src/core/**'
              - 'include/krpsim/Parser.hpp'
              - 'include/krpsim/Types.hpp'
              - 'resources/**'
              - 'benchmarks/bench_parser.cpp'
              - 'benchmarks/CMakeLists.txt'
              - 'CMakeLists.txt'
            solver:
              - 'src/solver/**'
              - 'src/core/**'
              - 'src/mocks/**'
              - 'include/krpsim/Solver.hpp'
              - 'include/krpsim/Types.hpp'
              - 'benchmarks/bench_solvers.cpp'
              - 'benchmarks/CMakeLists.txt'
              - 'CMakeLists.txt'

      - name: Compute benchmark shards
        id: shards
        env:
          PARSER_CHANGED: ${{ steps.filter.outputs.parser }}
          SOLVER_CHANGED: ${{ steps.filter.outputs.solver }}
          RUN_ALL: ${{ github.event_name != 'pull_request' }}
        run: |
          shards='[]'
          add() {
            shards=$(echo "$shards" | jq --arg n "$1" --arg f "$2" '. + [{"name": $n, "benchmark_filter": $f}]')
          }

          if [ "$RUN_ALL" = "true" ] || [ "$PARSER_CHANGED" = "true" ]; then
            add "parser" "BM_ParseConfig"
          fi
          if [ "$RUN_ALL" = "true" ] || [ "$SOLVER_CHANGED" = "true" ]; then
            # Splitting solver coverage into 3 shards keeps each job well
            # under the recommended 1,000-benchmarks-per-shard limit and
            # lets solveBeamSearch (the heaviest strategy) run in parallel
            # with the cheaper ones instead of behind them.
            add "cheap-solvers" "BM_Solve(Naive|TargetPlan|GreedyByScore)"
            add "beam-search" "BM_SolveBeamSearch"
            add "best" "BM_SolveBest"
          fi

          echo "shards=$(echo "$shards" | jq -c .)" >> "$GITHUB_OUTPUT"

  benchmarks-simulation:
    name: Run benchmarks - simulation (${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.shards != '[]'
    runs-on: ubuntu-latest
    permissions: # optional for public repositories
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the benchmark target(s)
        run: |
          cmake -B build_bench -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCODSPEED_MODE=simulation
          cmake --build build_bench -j

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: ./build_bench/benchmarks/krpsim_bench --benchmark_filter='${{ matrix.shard.benchmark_filter }}'

  # Deterministic like simulation (allocation counting, not wall-clock), so it
  # runs on the same trigger/partial-run rules and shard split.
  benchmarks-memory:
    name: Run benchmarks - memory (${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.shards != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the benchmark target(s)
        run: |
          cmake -B build_bench -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCODSPEED_MODE=memory
          cmake --build build_bench -j

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: memory
          run: ./build_bench/benchmarks/krpsim_bench --benchmark_filter='${{ matrix.shard.benchmark_filter }}'

  # Wall-clock timing is noisy on shared GitHub-hosted runners (CodSpeed
  # recommends its own Hosted Macro Runners for stable walltime numbers), so
  # this doesn't gate every PR: only the two solver-heavy shards run, and
  # only on push to main / manual dispatch, purely as an investigative signal
  # alongside the simulation/memory numbers.
  benchmarks-walltime:
    name: Run benchmarks - walltime (${{ matrix.shard.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: beam-search, benchmark_filter: "BM_SolveBeamSearch" }
          - { name: best, benchmark_filter: "BM_SolveBest" }
    steps:
      - uses: actions/checkout@v5

      - name: Build the benchmark target(s)
        run: |
          cmake -B build_bench -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCODSPEED_MODE=walltime
          cmake --build build_bench -j

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: ./build_bench/benchmarks/krpsim_bench --benchmark_filter='${{ matrix.shard.benchmark_filter }}'
